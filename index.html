<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VexinStream — Watch Anime Free</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0b0c10;
      --surface: #14161f;
      --surface-hover: #1d202d;
      --accent: #7c5cff;
      --accent-hover: #9175ff;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #252836;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(11, 12, 16, 0.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem; display: flex; flex-wrap: wrap; gap: 1rem;
      align-items: center; justify-content: space-between;
    }
    .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; cursor: pointer; }
    .logo span { color: var(--accent); }
    .search-box { display: flex; gap: 0.5rem; flex-1; max-width: 440px; }
    input {
      width: 100%; padding: 0.65rem 1rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      outline: none; font-size: 0.95rem;
    }
    input:focus { border-color: var(--accent); }
    button {
      padding: 0.55rem 0.95rem; border-radius: 8px; border: none;
      background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;
      transition: 0.15s; white-space: nowrap; font-size: 0.85rem;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: var(--surface-hover); border: 1px solid var(--border); color: var(--text); }
    button.secondary:hover { border-color: var(--accent); }
    button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.failed { border-color: var(--err); opacity: 0.7; }

    main { max-width: 1280px; width: 100%; margin: 0 auto; padding: 2rem; flex: 1; }
    h2 { font-size: 1.25rem; margin-bottom: 1.25rem; color: var(--text); }

    /* Player Section */
    #player-section { display: none; margin-bottom: 2.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .player-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    .player-wrapper iframe, .player-wrapper video { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
    #status-banner {
      position: absolute; inset: 0; display: none; flex-direction: column; gap: 0.75rem;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88); color: var(--text); font-size: 0.95rem; padding: 1.5rem; text-align: center; z-index: 5;
    }
    .player-controls { padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
    .player-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
    .server-group-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .server-bar, .ep-grid { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .ep-grid { max-height: 170px; overflow-y: auto; padding-top: 0.5rem; border-top: 1px solid var(--border); }
    .ep-btn { padding: 0.4rem 0.75rem; font-size: 0.82rem; }

    /* Live Debug Console */
    .console-box {
      background: #090a0f; border: 1px solid var(--border); border-radius: 8px;
      padding: 0.75rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem; max-height: 160px; overflow-y: auto; line-height: 1.45;
    }
    .console-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
    .log-info { color: #93c5fd; }
    .log-ok { color: var(--ok); }
    .log-warn { color: var(--warn); }
    .log-err { color: var(--err); }

    /* Anime Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.25rem; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--accent); }
    .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
    .card-body { padding: 0.85rem; }
    .card-title { font-size: 0.95rem; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { font-size: 0.8rem; color: var(--muted); margin-top: 0.4rem; }

    footer {
      border-top: 1px solid var(--border); padding: 1.5rem 2rem;
      text-align: center; color: var(--muted); font-size: 0.85rem;
    }
    footer strong { color: var(--text); }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="resetHome()">Vexin<span>Stream</span></div>
    <form class="search-box" onsubmit="handleSearch(event)">
      <input type="text" id="search-input" placeholder="Search anime (English or Romaji)..." />
      <button type="submit">Search</button>
    </form>
  </header>

  <main>
    <section id="player-section">
      <div class="player-wrapper">
        <div id="status-banner">
          <div id="status-text">Loading stream...</div>
          <button onclick="tryNextServer()">Try Next Working Server →</button>
        </div>
        <video id="hls-video" controls playsinline style="display:none;"></video>
        <iframe id="video-frame" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
      </div>
      <div class="player-controls">
        <div class="player-header">
          <div>
            <h2 id="now-playing-title" style="margin-bottom: 0.25rem;">Anime Title</h2>
            <p id="now-playing-sub" style="color: var(--muted); font-size: 0.88rem;">Episode 1</p>
          </div>
          <div style="display:flex; gap:0.5rem;">
            <button class="secondary" onclick="tryNextServer()">↻ Auto-Next Server</button>
            <button class="secondary" onclick="closePlayer()">✕ Close</button>
          </div>
        </div>

        <div>
          <div class="server-group-label">Primary Embed Servers (Ad-Free Multi-Source):</div>
          <div class="server-bar" id="embed-server-bar"></div>
        </div>

        <div id="api-server-wrap" style="display:none;">
          <div class="server-group-label">Direct HLS API Servers (Re:ANIME / Anikoto / AnimePahe):</div>
          <div class="server-bar" id="api-server-bar"></div>
        </div>

        <div>
          <div class="server-group-label">Episodes:</div>
          <div class="ep-grid" id="episode-grid"></div>
        </div>

        <!-- Live Console Output -->
        <div>
          <div class="console-header">
            <span class="server-group-label" style="margin:0;">Live Stream Console / Diagnostics</span>
            <button class="secondary" style="padding:0.2rem 0.6rem; font-size:0.75rem;" onclick="clearConsole()">Clear Log</button>
          </div>
          <div class="console-box" id="debug-console"></div>
        </div>
      </div>
    </section>

    <h2 id="section-title">Trending Now</h2>
    <div class="grid" id="anime-grid"></div>
  </main>

  <footer>
    <p>Created &amp; Powered by <strong>VexinStream</strong> • Zero local storage.</p>
  </footer>

  <script>
    // Optional: Paste your Render Anivexa-API URL here (no trailing slash) for extra HLS servers
    const ANIVEXA_API_URL = "https://anivexa-api-55v6.onrender.com";

    const ANILIST_API = "https://graphql.anilist.co";
    let currentAnime = null;
    let currentEp = 1;
    let activeServerKey = "vidnest-sub";
    let failedServers = new Set();
    let hlsInstance = null;

    // 1. Verified AniList-ID & MAL-ID Embed Servers (Vidnest primary + AnimePahe direct)
    const EMBED_SERVERS = [
      { key: "vidnest-sub",       name: "Vidnest (Sub)",         url: (a, ep) => `https://vidnest.fun/anime/${a.id}/${ep}/sub` },
      { key: "vidnest-dub",       name: "Vidnest (Dub)",         url: (a, ep) => `https://vidnest.fun/anime/${a.id}/${ep}/dub` },
      { key: "vidnest-pahe-sub",  name: "AnimePahe Embed (Sub)", url: (a, ep) => `https://vidnest.fun/animepahe/${a.id}/${ep}/sub` },
      { key: "vidnest-pahe-dub",  name: "AnimePahe Embed (Dub)", url: (a, ep) => `https://vidnest.fun/animepahe/${a.id}/${ep}/dub` },
      { key: "vidlink-sub",       name: "VidLink (Sub)",         url: (a, ep) => `https://vidlink.pro/anime/${a.id}/${ep}?fallback=true` },
      { key: "vidlink-dub",       name: "VidLink (Dub)",         url: (a, ep) => `https://vidlink.pro/anime/${a.id}/${ep}?dub=true&fallback=true` },
      { key: "animenexus-sub",    name: "AnimeNexus (Sub)",      url: (a, ep) => `https://anime.nexus/embed/${a.id}/${ep}` },
      { key: "autoembed-sub",     name: "AutoEmbed (Sub)",       url: (a, ep) => `https://player.autoembed.cc/embed/anime/${a.id}/${ep}` },
      { key: "2embed-mal",        name: "2Embed (MAL)",          url: (a, ep) => `https://www.2embed.cc/embedanime/${a.idMal || a.id}-episode-${ep}` }
    ];

    // 2. Direct HLS Providers via Anivexa-API (Uses ID lookup + automatic title-search fallback)
    const API_SERVERS = [
      { key: "anizone-sub",   name: "AniZone (Sub)",   provider: "anizone",   lang: "sub" },
      { key: "animepahe-sub", name: "AnimePahe (Sub)", provider: "animepahe", lang: "sub" },
      { key: "anikoto-sub",   name: "Anikoto (Sub)",   provider: "anikoto",   lang: "sub" },
      { key: "anikoto-dub",   name: "Anikoto (Dub)",   provider: "anikoto",   lang: "dub" },
      { key: "reanime-sub",   name: "Re:ANIME (Sub)",  provider: "reanime",   lang: "sub" },
      { key: "reanime-dub",   name: "Re:ANIME (Dub)",  provider: "reanime",   lang: "dub" },
      { key: "allmanga-sub",  name: "AllManga (Sub)",  provider: "allmanga",  lang: "sub" }
    ];

    function logMsg(msg, level = "info") {
      const box = document.getElementById("debug-console");
      const time = new Date().toLocaleTimeString();
      const line = document.createElement("div");
      line.className = `log-${level}`;
      line.textContent = `[${time}] ${msg}`;
      box.appendChild(line);
      box.scrollTop = box.scrollHeight;
      console[level === "err" ? "error" : level === "warn" ? "warn" : "log"](`[VexinStream] ${msg}`);
    }

    function clearConsole() {
      document.getElementById("debug-console").innerHTML = "";
    }

    async function fetchAniList(query, variables = {}) {
      const res = await fetch(ANILIST_API, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ query, variables })
      });
      const json = await res.json();
      return json.data.Page.media;
    }

    async function loadTrending() {
      document.getElementById("section-title").textContent = "Trending Now";
      const query = `
        query {
          Page(perPage: 24) {
            media(type: ANIME, sort: TRENDING_DESC, isAdult: false) {
              id
              idMal
              episodes
              nextAiringEpisode { episode }
              seasonYear
              format
              title { english romaji native }
              coverImage { large }
            }
          }
        }`;
      renderGrid(await fetchAniList(query));
    }

    async function handleSearch(e) {
      e.preventDefault();
      const term = document.getElementById("search-input").value.trim();
      if (!term) return loadTrending();
      document.getElementById("section-title").textContent = `Results for "${term}"`;
      const query = `
        query ($search: String) {
          Page(perPage: 24) {
            media(type: ANIME, search: $search, sort: POPULARITY_DESC, isAdult: false) {
              id
              idMal
              episodes
              nextAiringEpisode { episode }
              seasonYear
              format
              title { english romaji native }
              coverImage { large }
            }
          }
        }`;
      renderGrid(await fetchAniList(query, { search: term }));
    }

    function renderGrid(list) {
      const grid = document.getElementById("anime-grid");
      grid.innerHTML = "";
      list.forEach(anime => {
        const title = anime.title.english || anime.title.romaji;
        const totalEps = anime.episodes || (anime.nextAiringEpisode ? anime.nextAiringEpisode.episode - 1 : 12);
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${anime.coverImage.large}" alt="${title}" loading="lazy" />
          <div class="card-body">
            <div class="card-title">${title}</div>
            <div class="card-meta">${anime.format || "TV"} • ${anime.seasonYear || "TBA"} • ${totalEps || "?"} Eps</div>
          </div>`;
        card.onclick = () => {
          failedServers.clear();
          openPlayer(anime, 1);
        };
        grid.appendChild(card);
      });
    }

    function stopMedia() {
      const video = document.getElementById("hls-video");
      const iframe = document.getElementById("video-frame");
      const banner = document.getElementById("status-banner");
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
      video.pause();
      video.removeAttribute("src");
      video.style.display = "none";
      iframe.src = "";
      iframe.style.display = "none";
      banner.style.display = "none";
    }

    function setBanner(text, showRetry = true) {
      const banner = document.getElementById("status-banner");
      document.getElementById("status-text").textContent = text;
      banner.querySelector("button").style.display = showRetry ? "inline-block" : "none";
      banner.style.display = "flex";
    }

    function tryNextServer() {
      const allKeys = [
        ...EMBED_SERVERS.map(s => s.key),
        ...(ANIVEXA_API_URL ? API_SERVERS.map(s => s.key) : [])
      ];
      failedServers.add(activeServerKey);
      const next = allKeys.find(k => !failedServers.has(k));
      if (!next) {
        failedServers.clear();
        activeServerKey = allKeys[0];
        logMsg("All servers cycled; resetting to first server.", "warn");
      } else {
        activeServerKey = next;
        logMsg(`Switching to fallback server: ${activeServerKey}`, "info");
      }
      openPlayer(currentAnime, currentEp);
    }

    async function playApiStream(serverObj, anime, ep) {
      const video = document.getElementById("hls-video");
      const cleanTitle = (anime.title.romaji || anime.title.english || "").replace(/[^\w\s-]/g, " ").trim();
      setBanner(`Resolving ${serverObj.name} for "${cleanTitle}" (AniList ${anime.id}) Ep ${ep}...`, false);
      logMsg(`Requesting ${serverObj.name} -> AniList ID ${anime.id} | MAL ID ${anime.idMal || "N/A"} | Title "${cleanTitle}"`);

      try {
        let endpoint = `${ANIVEXA_API_URL}/watch/${serverObj.provider}/${anime.id}/${serverObj.lang}/${serverObj.provider}-${ep}`;
        logMsg(`GET ${endpoint}`);
        let srcRes = await fetch(endpoint);
        let srcData = await srcRes.json();

        if ((!srcRes.ok || srcData.error) && cleanTitle) {
          logMsg(`AniList ID match failed (${srcData.error || srcRes.status}). Searching provider by title: "${cleanTitle}"...`, "warn");
          const searchUrl = `${ANIVEXA_API_URL}/search/${serverObj.provider}?q=${encodeURIComponent(cleanTitle)}`;
          const searchRes = await fetch(searchUrl);
          if (searchRes.ok) {
            const searchData = await searchRes.json();
            const hits = searchData.results || searchData.data || (Array.isArray(searchData) ? searchData : []);
            if (hits.length > 0 && hits[0].id) {
              logMsg(`Title match found: ${hits[0].title || hits[0].name} (ID: ${hits[0].id})`, "ok");
              const epUrl = `${ANIVEXA_API_URL}/watch/${serverObj.provider}/${hits[0].id}/${serverObj.lang}/${encodeURIComponent(hits[0].id)}-${ep}`;
              srcRes = await fetch(epUrl);
              srcData = await srcRes.json();
            }
          }
        }

        const sources = srcData.sources || srcData.data?.sources || (srcData.url ? [srcData] : []);
        const best = sources.find(s => s.url?.includes(".m3u8")) || sources[0];

        if (!best || !best.url) {
          throw new Error(srcData.error || `HTTP ${srcRes.status} - No playable stream returned`);
        }

        const streamUrl = best.url;
        logMsg(`Stream resolved (${serverObj.name}): ${streamUrl.slice(0, 75)}...`, "ok");
        document.getElementById("status-banner").style.display = "none";
        video.style.display = "block";

        if (Hls.isSupported() && streamUrl.includes(".m3u8")) {
          hlsInstance = new Hls();
          hlsInstance.loadSource(streamUrl);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            logMsg(`HLS manifest loaded — starting playback.`, "ok");
            video.play().catch(() => {});
          });
          hlsInstance.on(Hls.Events.ERROR, (_, data) => {
            if (data.fatal) {
              logMsg(`HLS fatal error (${data.type}: ${data.details}) — upstream CDN blocked browser playback.`, "err");
              failedServers.add(serverObj.key);
              renderServerButtons();
              setBanner(`${serverObj.name} CDN blocked direct playback. Click below to switch servers.`);
            }
          });
        } else {
          video.src = streamUrl;
          video.play().catch(() => {});
        }
      } catch (err) {
        logMsg(`${serverObj.name} failed: ${err.message}`, "err");
        failedServers.add(serverObj.key);
        renderServerButtons();
        setBanner(`${serverObj.name} unavailable (${err.message}).`);
      }
    }

    function renderServerButtons() {
      const embedBar = document.getElementById("embed-server-bar");
      embedBar.innerHTML = "";
      EMBED_SERVERS.forEach(srv => {
        const btn = document.createElement("button");
        const isFail = failedServers.has(srv.key);
        btn.className = `secondary ${activeServerKey === srv.key ? "active" : ""} ${isFail ? "failed" : ""}`;
        btn.textContent = isFail ? `✕ ${srv.name}` : srv.name;
        btn.onclick = () => { activeServerKey = srv.key; openPlayer(currentAnime, currentEp); };
        embedBar.appendChild(btn);
      });

      const apiWrap = document.getElementById("api-server-wrap");
      const apiBar = document.getElementById("api-server-bar");
      if (ANIVEXA_API_URL) {
        apiWrap.style.display = "block";
        apiBar.innerHTML = "";
        API_SERVERS.forEach(srv => {
          const btn = document.createElement("button");
          const isFail = failedServers.has(srv.key);
          btn.className = `secondary ${activeServerKey === srv.key ? "active" : ""} ${isFail ? "failed" : ""}`;
          btn.textContent = isFail ? `✕ ${srv.name}` : srv.name;
          btn.onclick = () => { activeServerKey = srv.key; openPlayer(currentAnime, currentEp); };
          apiBar.appendChild(btn);
        });
      }
    }

    function openPlayer(anime, ep) {
      currentAnime = anime;
      currentEp = ep;
      const title = anime.title.english || anime.title.romaji;
      const totalEps = anime.episodes || (anime.nextAiringEpisode ? anime.nextAiringEpisode.episode - 1 : 24) || 12;

      document.getElementById("player-section").style.display = "block";
      document.getElementById("now-playing-title").textContent = title;
      document.getElementById("now-playing-sub").textContent = `Episode ${ep} • AniList #${anime.id}${anime.idMal ? ` • MAL #${anime.idMal}` : ""}`;
      window.scrollTo({ top: 0, behavior: "smooth" });

      stopMedia();
      renderServerButtons();

      const apiMatch = ANIVEXA_API_URL ? API_SERVERS.find(s => s.key === activeServerKey) : null;
      if (apiMatch) {
        playApiStream(apiMatch, anime, ep);
      } else {
        const embedMatch = EMBED_SERVERS.find(s => s.key === activeServerKey) || EMBED_SERVERS[0];
        const targetUrl = embedMatch.url(anime, ep);
        logMsg(`Loading iframe [${embedMatch.name}]: ${targetUrl}`);
        const iframe = document.getElementById("video-frame");
        iframe.style.display = "block";
        iframe.onload = () => logMsg(`Iframe [${embedMatch.name}] finished loading frame.`, "ok");
        iframe.onerror = () => {
          logMsg(`Iframe [${embedMatch.name}] failed to load.`, "err");
          failedServers.add(embedMatch.key);
          renderServerButtons();
        };
        iframe.src = targetUrl;
      }

      const epGrid = document.getElementById("episode-grid");
      epGrid.innerHTML = "";
      for (let i = 1; i <= totalEps; i++) {
        const btn = document.createElement("button");
        btn.className = `secondary ep-btn ${i === ep ? "active" : ""}`;
        btn.textContent = `Ep ${i}`;
        btn.onclick = () => openPlayer(anime, i);
        epGrid.appendChild(btn);
      }
    }

    function closePlayer() {
      stopMedia();
      document.getElementById("player-section").style.display = "none";
    }

    function resetHome() {
      document.getElementById("search-input").value = "";
      closePlayer();
      loadTrending();
    }

    logMsg("VexinStream initialized. Ready.");
    loadTrending();
  </script>
</body>
</html>
